name: Auto SHSH Blob Saver

on:
  workflow_dispatch:
    inputs:
      manual_build:
        description: "Optional specific Build ID"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-shsh-blob-saver
  cancel-in-progress: false

jobs:
  check-and-save:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      # Public automation repository
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Private archive checkout
      - name: Checkout private blob archive
        uses: actions/checkout@v4
        with:
          repository: PickAstley11/iPhone_11_Pro_Blobs
          ref: main
          token: ${{ secrets.BLOBS_REPO_TOKEN }}
          path: blob-archive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install helper
        run: |
          python3 -m pip install --disable-pip-version-check remotezip
          chmod +x ./tsschecker_macos_arm64

      - name: Discover, check and save blobs
        id: monitor
        env:
          ECID: ${{ secrets.ECID }}
          GENERATOR: ${{ secrets.GENERATOR }}
          APNONCE: ${{ secrets.APNONCE }}
          CRYPTEX_SEED: ${{ secrets.CRYPTEX_SEED }}
          CRYPTEX_NONCE: ${{ secrets.CRYPTEX_NONCE }}
          BBSNUM: ${{ secrets.BBSNUM }}
          MANUAL_BUILD: ${{ inputs.manual_build }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import plistlib
          import shutil
          import subprocess
          import tempfile
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from remotezip import RemoteZip

          DEVICE = "iPhone12,3"
          TSSCHECKER = "./tsschecker_macos_arm64"
          API_URL = "https://api.appledb.dev/ios/main.json"

          ECID = os.environ["ECID"].strip()
          GENERATOR = os.environ["GENERATOR"].strip()
          APNONCE = os.environ["APNONCE"].strip().lower().removeprefix("0x")
          CRYPTEX_SEED = os.environ["CRYPTEX_SEED"].strip()
          CRYPTEX_NONCE = os.environ["CRYPTEX_NONCE"].strip()
          BBSNUM = os.environ["BBSNUM"].strip()
          MANUAL_BUILD = os.environ.get("MANUAL_BUILD", "").strip()

          required = {
              "ECID": ECID,
              "GENERATOR": GENERATOR,
              "APNONCE": APNONCE,
              "CRYPTEX_SEED": CRYPTEX_SEED,
              "CRYPTEX_NONCE": CRYPTEX_NONCE,
              "BBSNUM": BBSNUM,
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing required Actions secrets: " + ", ".join(missing))

          try:
              ECID_NUMBER = int(ECID, 16) if ECID.lower().startswith("0x") else int(ECID, 10)
          except ValueError:
              raise SystemExit("ECID secret is not a valid integer representation.")

          SAVE_DIR = Path("blob-archive/blobs")
          INVENTORY_FILE = Path("firmwares/iphone12,3.json")
          SAVE_DIR.mkdir(parents=True, exist_ok=True)
          INVENTORY_FILE.parent.mkdir(parents=True, exist_ok=True)

          new_blobs = []

          def log(message):
              print(message, flush=True)

          def load_inventory():
              if not INVENTORY_FILE.exists():
                  return {}
              try:
                  with INVENTORY_FILE.open("r", encoding="utf-8") as handle:
                      data = json.load(handle)
                  return data.get("builds", {})
              except Exception:
                  log("[!] Firmware inventory could not be read; starting an empty inventory.")
                  return {}

          def save_inventory(inventory):
              data = {
                  "device": DEVICE,
                  "last_updated": datetime.now(timezone.utc).isoformat(),
                  "builds": inventory,
              }
              fd, temporary = tempfile.mkstemp(
                  dir=str(INVENTORY_FILE.parent), prefix=".inventory-"
              )
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as handle:
                      json.dump(data, handle, indent=2, sort_keys=True)
                  os.replace(temporary, INVENTORY_FILE)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)

          def fetch_appledb():
              log("[*] Fetching AppleDB firmware catalogue...")
              request = urllib.request.Request(
                  API_URL,
                  headers={
                      "User-Agent": "AutoSHSH/2.0",
                      "Accept-Encoding": "gzip",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  if response.headers.get("Content-Encoding", "").lower() == "gzip":
                      raw = gzip.decompress(raw)
              data = json.loads(raw.decode("utf-8"))
              return list(data.values()) if isinstance(data, dict) else data

          def discover_builds(inventory):
              try:
                  builds = fetch_appledb()
                  discovered = 0

                  for item in builds:
                      if item.get("osStr") != "iOS":
                          continue

                      build = item.get("build")
                      if not build:
                          continue

                      ipsw_url = None
                      compatible = False

                      for source in item.get("sources", []):
                          if source.get("type") != "ipsw":
                              continue
                          if DEVICE not in source.get("deviceMap", []):
                              continue

                          compatible = True
                          for link in source.get("links", []):
                              url = link.get("url")
                              if url:
                                  ipsw_url = url
                                  break
                          if ipsw_url:
                              break

                      if not compatible:
                          continue

                      is_new = build not in inventory
                      previous = inventory.get(build, {})
                      inventory[build] = {
                          "version": item.get("version", previous.get("version", "Unknown")),
                          "build": build,
                          "ipsw_url": ipsw_url or previous.get("ipsw_url"),
                          "first_seen": previous.get(
                              "first_seen", datetime.now(timezone.utc).isoformat()
                          ),
                      }
                      if is_new:
                          discovered += 1

                  log(f"[+] AppleDB catalogue entries received: {len(builds)}")
                  return discovered
              except Exception:
                  log("[!] AppleDB discovery failed; continuing with saved historical inventory.")
                  return 0

          def existing_blob(build):
              build_lower = build.lower()
              for path in SAVE_DIR.glob("*.shsh2"):
                  if build_lower in path.name.lower():
                      return path
              return None

          def get_manifest(url, workdir):
              if not url:
                  return None
              try:
                  log("[+] Retrieving BuildManifest...")
                  manifest = Path(workdir) / "BuildManifest.plist"
                  with RemoteZip(url) as archive:
                      contents = archive.read("BuildManifest.plist")
                  manifest.write_bytes(contents)
                  plistlib.loads(manifest.read_bytes())
                  return str(manifest)
              except Exception:
                  log("[!] BuildManifest retrieval failed; falling back to Build ID.")
                  return None

          def validate_blob(path):
              try:
                  with open(path, "rb") as handle:
                      blob = plistlib.load(handle)

                  if not isinstance(blob, dict):
                      return False

                  ticket = blob.get("ApImg4Ticket") or blob.get("@ApImg4Ticket")
                  if not isinstance(ticket, bytes) or not ticket:
                      return False

                  if "ECID" in blob:
                      value = blob["ECID"]
                      actual_ecid = int(value) if isinstance(value, int) else (
                          int(str(value), 16)
                          if str(value).lower().startswith("0x")
                          else int(str(value), 10)
                      )
                      if actual_ecid != ECID_NUMBER:
                          return False

                  if "ApNonce" in blob:
                      nonce = blob["ApNonce"]
                      if isinstance(nonce, bytes):
                          nonce = nonce.hex()
                      if isinstance(nonce, str):
                          nonce = nonce.lower().removeprefix("0x")
                          if nonce != APNONCE:
                              return False

                  return True
              except Exception:
                  return False

          def save_blob(build, info):
              version = info.get("version", "Unknown")
              log("")
              log("=" * 55)
              log(f"[*] Checking iOS {version} ({build})")
              log("=" * 55)

              already_saved = existing_blob(build)
              if already_saved:
                  log("[SKIP] This build already exists in the private archive.")
                  return

              with tempfile.TemporaryDirectory(prefix="tss-capture-") as workdir:
                  capture_dir = Path(workdir) / "capture"
                  capture_dir.mkdir()

                  manifest = get_manifest(info.get("ipsw_url"), workdir)
                  command = [
                      TSSCHECKER,
                      "--device", DEVICE,
                      "--ecid", ECID,
                      "--generator", GENERATOR,
                      "--apnonce", APNONCE,
                      "--cryptexseed", CRYPTEX_SEED,
                      "--cryptexnonce", CRYPTEX_NONCE,
                      "--bbsnum", BBSNUM,
                      "--save-path", str(capture_dir),
                      "--erase-install",
                      "--save",
                  ]

                  if manifest:
                      command.extend(["--build-manifest", manifest])
                  else:
                      command.extend(["--buildid", build])

                  log("[*] Requesting personalized TSS ticket...")
                  try:
                      result = subprocess.run(
                          command,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          timeout=240,
                          check=False,
                      )
                  except subprocess.TimeoutExpired:
                      log("[-] TSS request timed out.")
                      return
                  except Exception:
                      log("[-] tsschecker could not be executed.")
                      return

                  if result.returncode != 0:
                      log(f"[-] TSS request did not succeed (exit code {result.returncode}).")
                      return

                  candidates = list(capture_dir.rglob("*.shsh2"))
                  if not candidates:
                      log("[-] No SHSH2 file was produced.")
                      return

                  valid_candidates = [path for path in candidates if validate_blob(path)]
                  if not valid_candidates:
                      log("[-] No blob passed local ticket validation.")
                      return

                  source = valid_candidates[0]
                  safe_ecid = ECID.lower().removeprefix("0x")
                  filename = f"{DEVICE}_{build}_{safe_ecid}.shsh2"
                  destination = SAVE_DIR / filename

                  if existing_blob(build) or destination.exists():
                      log("[SKIP] Existing archive entry preserved.")
                      return

                  fd, staged_name = tempfile.mkstemp(
                      dir=str(SAVE_DIR), prefix=".capture-", suffix=".tmp"
                  )
                  staged = Path(staged_name)
                  try:
                      with os.fdopen(fd, "wb") as output:
                          with source.open("rb") as input_file:
                              shutil.copyfileobj(input_file, output)
                          output.flush()
                          os.fsync(output.fileno())

                      if not validate_blob(staged):
                          log("[-] Staged blob failed validation.")
                          return

                      try:
                          os.link(staged, destination)
                      except FileExistsError:
                          log("[SKIP] Destination already exists; preserved.")
                          return

                      log(f"[SUCCESS] New blob saved to private archive: {build}")
                      new_blobs.append({"build": build, "version": version})
                  finally:
                      if staged.exists():
                          staged.unlink()

          log("[*] AutoSHSH starting...")
          log(f"[*] Device: {DEVICE}")

          inventory = load_inventory()
          discovered_count = discover_builds(inventory)

          if MANUAL_BUILD:
              if MANUAL_BUILD not in inventory:
                  inventory[MANUAL_BUILD] = {
                      "version": "Manual Build",
                      "build": MANUAL_BUILD,
                      "ipsw_url": None,
                      "first_seen": datetime.now(timezone.utc).isoformat(),
                  }
              targets = [MANUAL_BUILD]
          else:
              targets = sorted(inventory.keys())

          save_inventory(inventory)
          log(f"[+] Historical firmware count: {len(inventory)}")
          log(f"[+] Builds to examine: {len(targets)}")
          log(f"[+] Newly discovered builds: {discovered_count}")

          for index, build in enumerate(targets, 1):
              log(f"\n[{index}/{len(targets)}] Processing {build}")
              save_blob(build, inventory[build])

          log("")
          log("=" * 55)
          log(f"[+] New valid blobs: {len(new_blobs)}")
          log("=" * 55)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_count={len(new_blobs)}\n")
              output.write("new_blobs<<BLOB_LIST\n")
              for item in new_blobs:
                  output.write(f"iOS {item['version']} ({item['build']})\n")
              output.write("BLOB_LIST\n")
          PY

      # Commit only the non-sensitive firmware inventory to the PUBLIC repo
      - name: Commit firmware inventory
        run: |
          git config user.name "CloudBlobSaver"
          git config user.email "bot@github.com"
          git add -- firmwares/iphone12,3.json

          if git diff --cached --quiet; then
            echo "No public inventory changes."
          else
            git commit -m "AutoSHSH: update firmware inventory"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Commit and push private blobs (permanent reliable method)
      - name: Commit and push private blobs
        id: archive
        env:
          NEW_COUNT: ${{ steps.monitor.outputs.new_count }}
          BLOBS_REPO_TOKEN: ${{ secrets.BLOBS_REPO_TOKEN }}
        run: |
          if [ "${NEW_COUNT:-0}" -eq 0 ]; then
            echo "No new blobs to archive."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C blob-archive config user.name "CloudBlobSaver"
          git -C blob-archive config user.email "bot@github.com"

          git -C blob-archive add -- blobs

          if git -C blob-archive diff --cached --quiet; then
            echo "No new archive changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git -C blob-archive commit -m "AutoSHSH: archive new SHSH blobs"

            # Reliable method for fine-grained tokens
            git -C blob-archive push \
              "https://x-access-token:${BLOBS_REPO_TOKEN}@github.com/PickAstley11/iPhone_11_Pro_Blobs.git" \
              HEAD:main

            unset BLOBS_REPO_TOKEN
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: >-
          success() &&
          steps.archive.outputs.committed == 'true' &&
          steps.monitor.outputs.new_count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEW_BLOBS: ${{ steps.monitor.outputs.new_blobs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          lines = [
              line for line in os.environ.get("NEW_BLOBS", "").splitlines()
              if line.strip()
          ]

          if not webhook or not lines:
              print("No webhook or no new blobs.")
              raise SystemExit(0)

          payload = {
              "content": "@everyone",
              "embeds": [{
                  "title": "🎉 New SHSH Blob Captured!",
                  "description": "\n".join(lines),
                  "color": 65280,
              }],
              "allowed_mentions": {"parse": ["everyone"]},
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "AutoSHSH/2.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Discord notification sent:", response.status)
          except Exception:
              raise SystemExit("Discord notification failed.")
          PY
